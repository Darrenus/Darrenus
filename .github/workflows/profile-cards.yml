name: Update profile cards

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_cards.py
      - scripts/usage_cards.py
      - scripts/publish_ai_usage.py
      - scripts/sync_ai_usage.py
      - scripts/usage_history.py
      - scripts/test_ai_usage.py
      - data/ai-usage.json
      - .github/workflows/profile-cards.yml

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify workload accounting
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Render cards from public GitHub data
        run: python3 scripts/update_cards.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Render saved AI workload statistics
        run: python3 scripts/usage_cards.py
      - name: Commit updated cards
        run: |
          if [ -n "$(git status --porcelain assets/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/
            git commit -m "chore: refresh profile cards"
            if ! git push; then
              git fetch origin main
              git rebase origin/main
              git push
            fi
          fi
